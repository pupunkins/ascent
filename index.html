<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моё восхождение</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9EDF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column; a mountain ascent on top, three goal "summits" below, glass tab bar at the bottom */
:root{
  --bg:#ECEFF8; --sky-a:#DCE5F8; --sky-b:#F7E7E0; --sky-c:#E7E0F6;
  --ink:#1D2133; --muted:#6B6F86; --faint:#9A9DB2;
  --card:rgba(255,255,255,.66); --card-solid:#FFFFFF; --line:rgba(29,33,51,.09);
  --m-top:#C9D6EE; --m-mid:#8FA8D2; --m-base:#7A73B8; --ridge:#B9C7E6;
  --trail:#FFFFFF; --trail-faint:rgba(255,255,255,.45); --sun:#FFF6DE;
  --school:#E08A5A; --anverse:#7467D6; --uni:#3E9C97;
  --good:#2F9E6E; --warn:#C98A1E; --low:#C25B5B;
  --accent:#4C4FC9; --on-accent:#FFFFFF;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131F; --sky-a:#1B2140; --sky-b:#2A1E2E; --sky-c:#1E1A36;
  --ink:#ECEDF6; --muted:#A3A6BF; --faint:#6E7190;
  --card:rgba(32,35,56,.72); --card-solid:#1E2135; --line:rgba(236,237,246,.10);
  --m-top:#4A5A8C; --m-mid:#33427A; --m-base:#3A2F6E; --ridge:#283363;
  --trail:#E9E6FF; --trail-faint:rgba(233,230,255,.22); --sun:#FFE9B8;
  --school:#F0A070; --anverse:#9A8FF0; --uni:#5FC1BB;
  --good:#5BC796; --warn:#E3AC4C; --low:#E58585;
  --accent:#8F92FF; --on-accent:#11131F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11131F; --sky-a:#1B2140; --sky-b:#2A1E2E; --sky-c:#1E1A36;
  --ink:#ECEDF6; --muted:#A3A6BF; --faint:#6E7190;
  --card:rgba(32,35,56,.72); --card-solid:#1E2135; --line:rgba(236,237,246,.10);
  --m-top:#4A5A8C; --m-mid:#33427A; --m-base:#3A2F6E; --ridge:#283363;
  --trail:#E9E6FF; --trail-faint:rgba(233,230,255,.22); --sun:#FFE9B8;
  --school:#F0A070; --anverse:#9A8FF0; --uni:#5FC1BB;
  --good:#5BC796; --warn:#E3AC4C; --low:#E58585;
  --accent:#8F92FF; --on-accent:#11131F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 15% 0%,var(--sky-a),transparent 70%),
    radial-gradient(55% 45% at 100% 30%,var(--sky-c),transparent 70%),
    radial-gradient(70% 50% at 0% 100%,var(--sky-b),transparent 70%),
    var(--bg)}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.icon-btn svg{width:20px;height:20px}
.title{font-family:var(--f-display);font-size:34px;line-height:1.08;letter-spacing:-.01em}
.title em{font-style:italic;color:var(--muted)}

.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* mountain */
.mountain{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky-a),var(--sky-c))}
.mountain svg{display:block;width:100%;height:auto}
.mountain .legend{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.node-label{font:600 11px var(--f-body);fill:var(--ink)}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.3}}

/* support */
.support{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.support .head{display:flex;align-items:center;gap:10px}
.orb{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,var(--sun),var(--anverse) 75%);filter:blur(.3px);box-shadow:0 0 22px color-mix(in srgb,var(--anverse) 45%,transparent)}
.support h3{font-family:var(--f-display);font-size:19px}
.support p{color:var(--ink);opacity:.9}
.support p+p{margin-top:2px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:14px 6px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:0 6px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.25}

/* goal cards */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.section-h h2{font-family:var(--f-display);font-size:22px}
.goals{display:flex;flex-direction:column;gap:14px}
.goal-card{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;width:100%}
.goal-card .row{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.goal-card h3{font-size:16px;font-weight:600;flex:1;min-width:0}
.goal-card .pct{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.goal-card .g12{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));transition:width .5s ease}
.goal-card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}

/* week screen */
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:62px;padding:8px 0 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);scroll-snap-align:center}
.wk b{font-size:15px;font-variant-numeric:tabular-nums}
.wk small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.now{border-color:var(--accent)}
.wk.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk.sel small{color:inherit;opacity:.7}
.wk .mk{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.mk.good{background:var(--good)} .mk.warn{background:var(--warn)} .mk.low{background:var(--low)} .mk.none{background:transparent;border:1px solid var(--faint)}

.score{padding:18px;display:flex;flex-direction:column;gap:12px}
.score .big{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.score .big b{font-family:var(--f-display);font-weight:500;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.score .big .verdict{font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--v) 16%,transparent);color:var(--v);white-space:nowrap}
.track{position:relative;height:12px;border-radius:99px;background:var(--line)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--v);transition:width .5s ease}
.track .goal85{position:absolute;left:85%;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.score .legend85{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.group{padding:14px 14px 8px;display:flex;flex-direction:column;gap:2px}
.group-h{display:flex;align-items:center;gap:9px;padding:2px 4px 8px}
.group-h h3{font-size:14.5px;font-weight:600;flex:1}
.group-h .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tactic{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--c);flex:none;display:grid;place-items:center;margin-top:-1px;transition:background .15s}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.tactic.done .check{background:var(--c)}
.tactic.done .check svg{opacity:1}
.tactic .t{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.tactic.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.tactic .acts{display:flex;gap:2px;flex:none}
.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--faint)}
.mini:hover{background:var(--line);color:var(--ink)}
.mini svg{width:16px;height:16px}
.add-row{display:flex;align-items:center;gap:8px;padding:10px 4px 6px;color:var(--muted);font-size:14px;font-weight:600;border-top:1px solid var(--line);width:100%;text-align:left}
.add-row span.plus{width:24px;height:24px;border-radius:8px;border:1.5px dashed var(--faint);display:grid;place-items:center;font-size:16px;line-height:1}

.review{padding:18px;display:flex;flex-direction:column;gap:12px}
.review h2,.card-h{font-family:var(--f-display);font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;resize:vertical}
textarea{min-height:64px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:99px;font-weight:600;font-size:14.5px;background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--card-solid);color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default}
.ai-out{font-size:14.5px;padding:14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--anverse) 9%,var(--card-solid));border:1px solid var(--line);white-space:pre-wrap}

/* goal detail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);font-size:14px}
.back svg{width:18px;height:18px}
.hero-goal{padding:20px;border-radius:var(--r-lg);color:#fff;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));display:flex;flex-direction:column;gap:12px}
.hero-goal h1{font-family:var(--f-display);font-size:28px;line-height:1.1}
.hero-goal .bar{background:rgba(255,255,255,.3)}
.hero-goal .bar i{background:#fff}
.hero-goal .sub{display:flex;justify-content:space-between;font-size:13px;opacity:.92;font-weight:600}
.trail-list{padding:16px 16px 10px;display:flex;flex-direction:column}
.ms{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.ms:not(:last-of-type)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.ms.done:not(:last-of-type)::before{background:var(--c)}
.ms .check{border-radius:50%}
.ms .t{flex:1;min-width:0;padding-top:1px;font-size:14.5px;overflow-wrap:anywhere}
.ms.done .t{color:var(--muted)}
.inline-add{display:flex;gap:8px;margin-top:4px}
.inline-add input{flex:1;min-width:0}
.inline-add .btn{min-height:44px;padding:0 14px}

/* rules */
.rule{padding:16px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.rule .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card-solid);border:1px solid var(--line);font-family:var(--f-display);font-size:15px}
.rule h3{font-size:15px;font-weight:600;margin-bottom:3px}
.rule p{font-size:14px;color:var(--muted)}
.blocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.blk{padding:12px 10px;border-radius:var(--r-md);background:var(--card-solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.blk b{font-size:13px}
.blk span{font-size:12px;color:var(--muted);line-height:1.3}
.ritual{padding:6px 16px 10px}
.ritual .tactic{--c:var(--accent)}

/* week 13 chart */
.chart{padding:16px;display:flex;flex-direction:column;gap:10px}
.chart svg{width:100%;height:auto;display:block}

/* three mountains carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:9%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 82%;scroll-snap-align:center;transition:transform .35s ease,opacity .35s ease}
.slide:not(.on){transform:scale(.93);opacity:.62}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
.slide-m{background:linear-gradient(180deg,var(--sky-a),color-mix(in srgb,var(--c) 14%,var(--sky-c)))}
.slide-head{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.slide-head .eyebrow{font-size:10.5px}
.slide-head b{font-weight:500;font-size:20px;color:var(--ink)}
.slide-alt{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.slide-alt b{font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--c)}
.slide-alt span{font-size:11px;color:var(--muted);font-weight:600}
.car-dots{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.cdot{width:8px;height:8px;border-radius:99px;background:var(--faint);opacity:.5;transition:width .25s,background .25s,opacity .25s}
.cdot[aria-selected="true"]{width:24px;background:var(--c);opacity:1}
.main-card{padding:18px;display:flex;flex-direction:column;gap:12px}
.main-card h2{font-size:21px;line-height:1.25}
.metric{display:flex;flex-direction:column;gap:6px}
.metric-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.metric-h b{color:var(--ink)}
.timeline{padding:16px 14px 10px;display:flex;flex-direction:column;gap:8px}
.timeline .card-h{font-size:17px;white-space:nowrap}
.timeline .eyebrow{white-space:nowrap}
.timeline svg{width:100%;height:auto;display:block;overflow:visible}
.goal-card .peak-name{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--c);letter-spacing:.02em}
.goal-card.is-main{border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.goal-card.is-main h3{font-size:18px}
.hero-goal .alt{display:flex;align-items:baseline;gap:8px}
.hero-goal .alt b{font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1}
.hero-goal .alt span{font-size:14px;opacity:.9;font-weight:600}
.camp{display:block;font-size:11px;font-weight:700;color:var(--c);letter-spacing:.03em;margin-bottom:2px;font-variant-numeric:tabular-nums}
.vision{font-size:18px;line-height:1.4}
textarea.objective{font-family:var(--f-display);font-size:17px;line-height:1.35;border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.when{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
/* route cards */
.route{position:relative;display:flex;flex-direction:column;gap:16px;width:100%;text-align:left;padding:20px 20px 18px;border-radius:28px;color:#fff;overflow:hidden;
  background:
    radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 45%,#120806) 0%,transparent 60%),
    radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--c) 75%,#fff) 0%,transparent 55%),
    linear-gradient(135deg,color-mix(in srgb,var(--c) 60%,#1a0d08),var(--c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),0 22px 40px -22px color-mix(in srgb,var(--c) 80%,transparent)}
.route::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 38%)}
.route-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.route-name{min-width:0;display:flex;flex-direction:column;gap:3px}
.route-name h3{font-family:var(--f-body);font-weight:600;font-size:20px;line-height:1.15;color:#fff}
.route-name span{font-size:12.5px;color:rgba(255,255,255,.72)}
.route-big{display:flex;align-items:baseline;gap:2px;flex:none}
.route-big b{font-family:var(--f-body);font-weight:500;font-size:44px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.route-big span{font-size:14px;color:rgba(255,255,255,.7);font-weight:500}
.route-bar{height:20px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.route-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.55) 55%,#fff);box-shadow:0 0 18px rgba(255,255,255,.55);transition:width .6s ease}
.route-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.route-stat{display:flex;align-items:center;gap:10px;min-width:0}
.route-stat span{display:block;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85)}
.route-stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.route-stat small{font-size:12px;font-weight:500;color:rgba(255,255,255,.7);margin-left:1px}
.ring{width:36px;height:36px;flex:none}
.ring-t{fill:none;stroke:rgba(255,255,255,.22);stroke-width:6}
.ring-v{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
.route.is-main .route-big b{font-size:50px}
.route:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* diary */
.diary-feed{display:flex;flex-direction:column;gap:12px}
.sticker{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.sticker-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sticker-h b{font-family:var(--f-display);font-weight:500;font-size:16px}
.sticker-h span{font-size:12.5px;color:var(--muted)}
.sticker.is-today{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));scroll-margin-top:80px}
.sticker.is-today .sticker-h b{font-size:21px}
.diary-saved{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--faint)}
textarea.diary-text{min-height:70px;font-size:15.5px;line-height:1.55;border:0;background:transparent;padding:2px 0;resize:none}
.sticker.is-today textarea.diary-text{min-height:170px}

/* Ready-made plans per mountain can be returned here by goal id (objective, camps, habits). Empty by default:

function planFor(id){ return null; }
function applyPlan(s, id){
  const g = s.goals.find(x => x.id === id), p = planFor(id);
  if (!g || !p) return;
  Object.assign(g, p);
  s.tactics = s.tactics.filter(t => t.goal !== id || t.done)

function migrate(s){

let docRef = null, writing = false, dirty = false, saveTimer = null;
function cacheLocal(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
function save(){
  S.updatedAt = Date.now(); S.draft = false;
  cacheLocal();
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if (!docRef) return;
  if (writing) { dirty = true; return; }
  writing = true; dirty = false;
  try { await docRef.set({ state: JSON.parse(JSON.stringify(S)), updatedAt: S.updatedAt }); setSync('cloud'); }
  catch(e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { docRef = null; setSync('local'); } }
  writing = false;
  if (dirty) flush();
}
function setSync(s){ ui.sync = s; const el = document.getElementById('syncState'); if (el) el.outerHTML = syncHTML(); }
async function connect(){
  try {
    if (!window.claude || !window.claude.use) { setSync('local'); return; }
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { setSync('local'); return; }
    docRef = db.doc('data/users/' + id + '/ascent');
    const timer = setTimeout(() => { if (ui.sync === 'pending') setSync('local'); }, 10000);
    docRef.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.metadata.fromCache) { clearTimeout(timer); setSync('cloud'); }
      if (snap.exists) {
        const d = snap.data();
        if (d && d.state && (d.updatedAt || 0) > (S.updatedAt || 0)) {
          S = migrate(JSON.parse(JSON.stringify(d.state))); S.updatedAt = d.updatedAt; cacheLocal();
          if (!document.activeElement || !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) render();
        }
      } else if (!snap.metadata.fromCache && !S.draft) { flush(); }
    }, () => { clearTimeout(timer); docRef = null; setSync('local'); });
  } catch(e) { setSync('local'); }
}

/* ---------- dates & scoring ---------- */
const DAY = 864e5;
function startDate(){ const [y,m,d] = S.start.split('-').map(Number); return new Date(y, m-1, d); }
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysSinceStart(){ return Math.round((today() - startDate()) / DAY); }
function curWeek(){ const n = daysSinceStart(); return n < 0 ? 0 : Math.min(13, Math.floor(n/7) + 1); }
function dayInWeek(){ const n = daysSinceStart(); return n < 0 ? -1 : n % 7; }
function weekRange(w){
  const a = new Date(startDate().getTime() + (w-1)*7*DAY), b = new Date(a.getTime() + 6*DAY);
  return shortDate(a) + ' – ' + shortDate(b);
}
const MON3 = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function shortDate(d){ return d.getDate() + ' ' + MON3[d.getMonth()]; }
const tacticsOf = (w, g) => S.tactics.filter(t => t.week === w && (!g || t.goal === g));
const dayKey = (w, g, d) => w + ':' + g + ':' + d;
const cell = (w, g, d) => (S.log || {})[dayKey(w, g, d)] || null;
function daysDone(w, g){ let n = 0; for (let d = 0; d < 7; d++) { const c = cell(w, g, d); if (c && c.c) n++; } return n; }
function scoreG(w, g){ if (w < 1 || w > 12) return null; const n = daysDone(w, g); if (w > curWeek() && !n) return null; return Math.min(1, n / (S.workdays || 6)); }
function score(w){ const v = ordered().map(g => scoreG(w, g.id)).filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null; }
function avgScore(upTo){
  const vals = []; for (let w = 1; w <= upTo; w++) { const s = score(w); if (s !== null) vals.push(s); }
  return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
}
const pct = x => x === null ? '—' : Math.round(x*100) + '%';
const goalPct = g => g.milestones.length ? g.milestones.filter(m=>m.done).length / g.milestones.length : 0;
function verdict(s){
  if (s === null) return { t:'нет плана', c:'var(--faint)', k:'none' };
  if (s >= .85) return { t:'исполнено', c:'var(--good)', k:'good' };
  if (s >= .65) return { t:'почти', c:'var(--warn)', k:'warn' };
  return { t:'ниже планки', c:'var(--low)', k:'low' };
}
/* Current week is judged against the working days already elapsed, not the whole week */
function elapsedWork(w){ const cw = curWeek(); if (w < cw) return S.workdays; if (w > cw) return 0; return Math.min(S.workdays, dayInWeek() + 1); }
function verdictFor(w, s){
  if (s === null) return verdict(null);
  if (w !== curWeek()) return verdict(s);
  const ratio = s / Math.max(1e-9, elapsedWork(w) / S.workdays);
  if (ratio >= .85) return { t:'в темпе', c:'var(--good)', k:'good' };
  if (ratio >= .65) return { t:'чуть отстаёшь', c:'var(--warn)', k:'warn' };
  return { t:'отстаёшь', c:'var(--low)', k:'low' };
}
const goalById = id => S.goals.find(g => g.id === id);
const ordered = () => ORDER.map(goalById).filter(Boolean).concat(S.goals.filter(g => !ORDER.includes(g.id)));
const peakOf = g => PEAKS[g.id] || { peak: g.name, h: 8000, px: 180, py: 60, w: 100 };
const altitude = g => Math.round(peakOf(g).h * goalPct(g));
const fmt = n => Number(n).toLocaleString('ru-RU');
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plural(n, a, b, c){ const m10 = n%10, m100 = n%100; return m10===1&&m100!==11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20) ? b : c); }

/* ---------- honest support ---------- */
function support(){
  const w = curWeek(), d = dayInWeek();
  if (w === 0) {
    const n = -daysSinceStart();
    return { h: 'До старта ' + n + ' ' + plural(n,'день','дня','дней'),
      p: ['Лагеря и постоянные действия по трём горам уже собраны. В понедельник открой «12 недель» и начни ставить галочки.',
          'Одно маленькое действие по каждой горе в день лучше большого рывка раз в неделю.'] };
  }
  if (w === 13) {
    const a = avgScore(12);
    const lines = [a === null ? 'Ты не вела оценку недель, поэтому итог посчитать нечем. Это тоже вывод: в следующем цикле начни с воскресного разбора.'
      : 'Среднее исполнение за 12 недель — ' + pct(a) + '. ' + (a >= .85 ? 'Это уровень, на котором цели перестают быть мечтами. Отметь это по-настоящему.' : a >= .65 ? 'Это больше, чем делает большинство, и всё ещё ниже твоей планки. Разбери, в какие недели ты проседала и почему.' : 'Цифра низкая, и прятать её незачем. Зато теперь видно, сколько ты реально тянешь. Следующий цикл планируй от этой цифры.')];
    lines.push('Тринадцатая неделя — для итогов и отдыха. Новые задачи начнутся со следующего цикла.');
    return { h: 'Неделя 13. Время оглянуться', p: lines };
  }
  const gs = ordered(), total = gs.length * S.workdays;
  const done = gs.reduce((a, g) => a + Math.min(daysDone(w, g.id), S.workdays), 0), s = score(w) || 0;
  const p = [];
  let h;
  if (s >= .85) {
    h = 'Неделя ' + w + ': ' + pct(s) + ', ты в зоне исполнения';
    p.push('Почти каждый рабочий день ты двигала все три горы. Не добавляй себе дел ради галочек, лучше спокойно закрой неделю.');
  } else {
    const expected = Math.min(1, (d + 1) / 7);
    if (d >= 5 && s < .65) {
      h = 'Неделя ' + w + ' идёт тяжело';
      p.push('Отмечено ' + done + ' из ' + total + ' дней по целям. До 85% уже не дотянуть, и это нормально. Сегодня сделай хотя бы одно действие по Эвересту и запиши в заметке, что помешало.');
    } else if (s + .2 < expected) {
      h = 'Неделя ' + w + ': есть отставание';
      p.push('Отмечено ' + done + ' из ' + total + ' дней по целям, а неделя прошла на ' + Math.round(expected*100) + '%. Одно маленькое действие по каждой горе сегодня вернёт темп.');
    } else {
      h = 'Неделя ' + w + ': идёшь в темпе';
      p.push('Отмечено ' + done + ' из ' + total + ' дней по целям. Ничего героического не нужно: одно действие по каждой горе в день.');
    }
  }
  if (w > 1) {
    const ps = score(w-1);
    if (ps !== null && ps >= .85) p.push('Прошлая неделя — ' + pct(ps) + '. Ты уже показала, что умеешь держать слово себе.');
    else if (ps !== null && ps < .65) p.push('Прошлая неделя — ' + pct(ps) + '. Это сигнал не о тебе, а о плане: возможно, тактик было больше, чем времени.');
    const r = S.reviews[w-1];
    if (!r || !(r.worked || r.didnt || r.change || r.grew || r.got || r.shift)) p.push('Три вопроса недели ' + (w-1) + ' без ответов. Пятнадцать минут на них дадут больше, чем ещё одна задача.');
  }
  if (d >= 3) {
    const stuck = ordered().filter(g => !daysDone(w, g.id));
    if (stuck.some(g => g.id === 'anverse')) p.push('На Эвересте на этой неделе ни шага, а это главный маршрут. Одна тактика по Anverse сегодня важнее двух по другим горам.');
    else if (stuck.length) p.push(stuck.map(g => peakOf(g).peak).join(' и ') + ': на этой неделе пока без движения.');
  }
  if (!num(S.main.incomeTarget) && p.length < 3) p.push('У главной цели пока нет цифры дохода. «Много денег» без суммы не проверить. Задай сумму в карточке главной цели.');
  return { h, p: p.slice(0, 3) };
}

async function runMot(){
  const sample = ui.sampleFn; if (!sample) return;
  ui.mot = { busy: true }; refreshMot();
  const t0 = today(), diary = [];
  for (let i = 13; i >= 0; i--) { const k = iso(new Date(t0.getTime() - i * DAY)), v = (S.diary[k] || '').trim(); if (v) diary.push({ дата: k, запись: v }); }
  const cw = Math.min(12, curWeek()), weeks = [];
  for (let w = Math.max(0, cw - 3); w <= cw; w++) {
    const r = S.reviews[w] || {}, p = S.plans[w] || {};
    weeks.push({ неделя: w === 0 ? 'до старта' : w, даты: weekRange(w),
      где_выросла: r.grew || null, что_получилось: r.got || null, что_поменялось: r.shift || null,
      главные_задачи: (p.top || []).map((t, i) => t.trim() ? t + (p.topDone && p.topDone[i] ? ' (сделано)' : ' (не отмечено)') : null).filter(Boolean),
      дел_сделано: Object.values(p.days || {}).flat().filter(t => t.done).length + ' из ' + Object.values(p.days || {}).flat().length,
      благодарность: p.thanks || null,
      исполнение_процент: w >= 1 && score(w) !== null ? Math.round(score(w) * 100) : null });
  }
  const data = { сегодня: iso(t0), главная_цель: S.main.goal, видение: S.main.vision, дневник_последние_2_недели: diary, недели: weeks,
    лагерей_взято: ordered().map(g => peakOf(g).peak + ': ' + g.milestones.filter(m => m.done).length + '/' + g.milestones.length) };
  const prompt = 'Ты — личный мотиватор и спокойный, честный наставник женщины, которая строит медийный бизнес: продакшн Anverse (главное), онлайн-школу и международный AI-университет. Она проходит челлендж «12 недель». ' +
    'Она может обесценивать себя: не замечать своих результатов, считать сделанное «мелочью», сравнивать себя с идеалом.\n\n' +
    'Её последние записи (JSON):\n' + JSON.stringify(data) + '\n\n' +
    'Напиши ей короткое тёплое сообщение по-русски, на «ты», как близкая подруга, которая в неё верит: 3–4 коротких предложения, один абзац, максимум 60 слов. Без списков, заголовков, смайликов и канцелярита. ' +
    'Назови одну-две конкретные вещи из её записей, которыми можно гордиться. Если видно обесценивание, одной фразой мягко покажи, что факты говорят обратное. ' +
    'Скажи, что всё получится, опираясь на её же факты. Закончи одним простым, конкретным советом на ближайшие дни. ' +
    'Пиши мягко и легко, без давления и нравоучений. Не льсти и не выдумывай: только то, что есть в данных. Если записей почти нет, по-доброму порадуйся самому старту и предложи записать одну строчку сегодня.';
  try {
    const { text } = await sample(prompt, { cache: false, onText: ({ text }) => { ui.mot = { busy: true, text }; refreshMot(); } });
    ui.mot = { text };
  } catch(e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { ui.sample = null; ui.mot = {}; }
    else ui.mot = { text: e && e.text, err: code === 'rate_limited' ? 'Слишком много запросов. Попробуй через несколько минут.' : 'Не получилось связаться. Попробуй ещё раз.' };
  }

    '<div class="field"><label>Как поставить на телефон</label><ol class="steps">' + (STANDALONE
      ? '<li>Открой этот сайт на телефоне в Safari (iPhone) или Chrome (Android).</li><li>iPhone: «Поделиться» → «На экран „Домой“». Android: меню ⋮ → «Установить приложение».</li><li>Данные хранятся на этом устройстве. Время от времени сохраняй копию ниже.</li>'
      : '<li>Открой эту ссылку на телефоне в Safari (iPhone) или Chrome (Android), войдя в тот же аккаунт Claude.</li><li>iPhone: «Поделиться» → «На экран „Домой“». Android: меню ⋮ → «Добавить на главный экран».</li><li>Иконка откроет приложение во весь экран. Данные подтянутся из аккаунта.</li>') + '</ol></div>' +
    '<div class="field"><label>Перенос данных</label><p class="note">Копия всех отметок, дневника и планов. Так прогресс переезжает между версией в Claude и своей версией на сайте.</p>' +
      '<div class="pair"><button class="btn soft" data-act="export">Сохранить копию</button><button class="btn soft" data-act="import">Загрузить копию</button></div></div>' +
    '<button class="btn soft" id="resetBtn" data-act="reset">Сбросить к примеру плана</button>' +
    '<button class="btn" data-act="closesheet">Готово</button>');
}
/* ---------- data transfer: export / import as JSON ---------- */
function exportSheet(){
  const json = JSON.stringify(S);
  openSheet('<h2>Копия данных</h2>' +
    '<p class="note">Скачай файл или скопируй текст ниже. Потом в другой версии приложения нажми «Загрузить копию».</p>' +
    '<textarea id="ex-json" class="json-box" readonly>' + esc(json) + '</textarea>' +
    '<div class="actions"><button class="btn soft" data-act="excopy">Скопировать</button><button class="btn" data-act="exfile">Скачать файл</button></div>' +
    '<button class="btn soft" data-act="closesheet">Закрыть</button>');
}
let importArmed = false;
function importSheet(){
  importArmed = false;
  openSheet('<h2>Загрузить копию</h2>' +
    '<p class="note">Выбери файл копии или вставь её текст. Текущие данные в этой версии заменятся.</p>' +
    '<input type="file" id="im-file" accept=".json,application/json" class="file-in">' +
    '<textarea id="im-json" class="json-box" placeholder="…или вставь сюда текст копии"></textarea>' +
    '<div class="actions"><button class="btn soft" data-act="closesheet">Отмена</button><button class="btn" id="imBtn" data-act="imgo">Загрузить</button></div>');
}
function parseBackup(txt){
  try { const s = JSON.parse(txt); return s && Array.isArray(s.goals) && s.main ? s : null; } catch(e) { return null; }
}

/* ---------- AI review ---------- */
async function runAI(w){
  const sample = ui.sampleFn; if (!sample) return;
  ui.ai[w] = { busy: true }; refreshAI(w);
  const data = {
    неделя: w, всего_недель: 12,
    исполнение_по_неделям: Array.from({length: Math.min(w,12)}, (_, i) => ({ неделя: i+1, процент: score(i+1) === null ? null : Math.round(score(i+1)*100) })),
    видение: S.main.vision, главная_цель: S.main.goal,
    доход: { цель_всего: S.main.incomeTarget || null, заработано: S.main.income || null, цель_в_месяц: S.main.monthTarget || null, этот_месяц: S.main.month || null },
    аудитория: { цель: S.main.audTarget || null, сейчас: S.main.aud || null },
    маршруты: ordered().map(g => ({ гора: peakOf(g).peak, главный: g.id === 'anverse', название: g.name, цель_12_недель: g.goal12, этапов_пройдено: g.milestones.filter(m=>m.done).length + '/' + g.milestones.length,
      дней_с_движением: daysDone(Math.min(w,12), g.id) + ' из ' + S.workdays, заметки_по_дням: [0,1,2,3,4,5,6].map(d => { const c = cell(Math.min(w,12), g.id, d); return c && c.n ? DOW[d] + ': ' + c.n : null; }).filter(Boolean) })),
    разбор: S.reviews[w] || {}
  };
  const prompt = 'Ты — честный наставник женщины, которая проходит челлендж «12 недель» (методика 12 Week Year). Каждый день она отмечает, двигала ли каждую из трёх целей, и пишет заметку. Эффективность = дни с движением из рабочих дней, планка 85%. ' +
    'Её главная цель — расти как медийная личность и много зарабатывать. К ней ведут три маршрута-горы: главный — Эверест, продакшн Anverse (блог, агентство, клиенты); опоры — Килиманджаро, онлайн-школа, и K2, международный университет.\n\n' +
    'Данные (JSON):\n' + JSON.stringify(data) + '\n\n' +
    'Напиши разбор этой недели по-русски, обращаясь на «ты». Правила: 4–6 коротких предложений одним абзацем, без списков и заголовков, без восклицательных знаков, без лести и общих фраз вроде «ты молодец». ' +
    'Опирайся только на данные. Назови, что реально получилось, и прямо скажи, где просадка и почему, если это видно. Если план явно перегружен, скажи об этом. ' +
    'Закончи одним конкретным шагом на следующую неделю. Тон тёплый, спокойный, как у человека, который в неё верит и поэтому не врёт.';
  try {
    const { text } = await sample(prompt, { cache: false, onText: ({ text }) => { ui.ai[w] = { busy: true, text }; refreshAI(w); } });
    ui.ai[w] = { text };
  } catch(e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { ui.sample = null; ui.ai[w] = {}; }
    else ui.ai[w] = { text: e && e.text, err: code === 'rate_limited' ? 'Слишком много запросов. Попробуй через несколько минут.' : 'Разбор не получился из-за сбоя связи. Попробуй ещё раз.' };
  }
  refreshAI(w);
}
function refreshAI(w){ const box = document.getElementById('aiBox'); if (box && ui.route === 'week' && ui.week === w) box.innerHTML = aiBlock(w); }

/* ---------- render & routing ---------- */
const TABS = [['path','Путь'],['week','12 недель'],['diary','Дневник']];
function render(){
  const app = document.getElementById('app'), y = window.scrollY;
  const v = { path: viewPath, week: viewWeek, goals: viewGoals, diary: viewDiary }[ui.route] || viewPath;
  app.style.minHeight = app.offsetHeight + 'px';
  app.innerHTML = v();
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => '<button class="tab" data-act="tab" data-k="' + k + '"' + (ui.route===k || (k==='path' && ui.route==='goals')?' aria-current="page"':'') + '>' + I[k] + '<span>' + l + '</span></button>').join('');
  if (ui.route === 'path') drawCarousel();
  if (ui.route === 'week') centerQStrip();
  if (ui.route === 'diary') { const td = document.getElementById('d-today'); if (td) requestAnimationFrame(() => td.scrollIntoView({ block: 'center' })); }
  document.querySelectorAll('#app textarea').forEach(autosize);
  if (ui.route === 'week') { const st = document.getElementById('weekStrip'), s = st && st.querySelector('.wk.sel'); centerIn(st, s); }
  app.style.minHeight = '';
  if (ui.route !== 'diary') window.scrollTo(0, y);
}
function go(route, keepScroll){
  ui.route = route;
  if (location.hash.slice(1) !== route) history.replaceState(null, '', '#' + route);
  render(); if (!keepScroll) window.scrollTo(0, 0);
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'closesheet' && el.classList.contains('scrim') && e.target !== el) return;
  switch (a) {
    case 'tab': ui.goal = null; if (el.dataset.k === 'week') ui.week = null; go(el.dataset.k); break;
    case 'goal': ui.goal = el.dataset.id; go('goals'); break;
    case 'goalback': ui.goal = null; go('path'); break;
    case 'dday': { const [y, m, d] = ui.diaryDay.split('-').map(Number), nd = new Date(y, m - 1, d + (+el.dataset.step)); if (nd <= today()) { ui.diaryDay = iso(nd); render(); } break; }
    case 'dopen': ui.diaryDay = el.dataset.k; render(); window.scrollTo(0, 0); break;
    case 'dsave': { const t = document.getElementById('diary-text'); if (t) { S.diary[t.dataset.diary] = t.value; save(); } const st = document.getElementById('diarySaved'); if (st) st.textContent = 'Сохранено'; toast('Запись сохранена'); break; }
    case 'openweek': ui.week = +el.dataset.w; go('week'); break;
    case 'slide': scrollToSlide(el.dataset.id, true); break;
    case 'pickweek': ui.week = +el.dataset.w; render(); break;
    case 'pickday': ui.day = +el.dataset.d; render(); break;
    case 'pday': ui.pday = +el.dataset.d; render(); break;
    case 'qweek': ui.qweek = +el.dataset.w; render(); break;
    case 'mot': runMot(); break;
    case 'export': exportSheet(); break;
    case 'import': importSheet(); break;
    case 'excopy': {
      const t = document.getElementById('ex-json'); t.select();
      (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Скопировано'), () => { try { document.execCommand('copy'); toast('Скопировано'); } catch(e) { toast('Выдели текст и скопируй вручную'); } });
      break;
    }
    case 'exfile': {
      const name = 'ascent-backup-' + iso(today()) + '.json', body = JSON.stringify(S, null, 1);
      if (!STANDALONE) {
        (async () => {
          const dl = await claude.use('downloads');
          if (!dl) { toast('Скачивание здесь недоступно. Скопируй текст'); return; }
          try { await dl.save({ filename: name, data: body }); toast('Копия сохранена'); }
          catch(e) { if (e && e.code !== 'declined') toast(e.code === 'rate_limited' ? 'Подожди пару секунд и попробуй ещё' : 'Скачать не вышло. Скопируй текст'); }
        })();
        break;
      }
      try {
        const a = document.createElement('a'), url = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch(e) { toast('Скачать не вышло. Скопируй текст'); }
      break;
    }
    case 'imgo': {
      const s = parseBackup(document.getElementById('im-json').value.trim());
      if (!s) { toast('Это не похоже на копию данных'); return; }
      if (!importArmed) { importArmed = true; el.textContent = 'Нажми ещё раз: заменить данные'; return; }
      S = migrate(s); save(); closeSheet(); ui.week = null; ui.qweek = null; render(); toast('Данные загружены');
      break;
    }
    case 'prio': { const p = planOf(ui.week), i = +el.dataset.i; p.topDone[i] = !p.topDone[i]; save(); render(); if (p.topDone[i] && p.top.every((t, j) => !t.trim() || p.topDone[j]) && p.top.some(t => t.trim())) toast('Все главные задачи недели закрыты'); break; }
    case 'ptask': { const l = planOf(ui.week).days[ui.pday] || [], t = l.find(x => x.id === el.dataset.id); if (t) { t.done = !t.done; save(); render(); } break; }
    case 'delptask': { const p = planOf(ui.week); p.days[ui.pday] = (p.days[ui.pday] || []).filter(x => x.id !== el.dataset.id); save(); render(); break; }
    case 'cell': {
      const w = ui.week, k = dayKey(w, el.dataset.g, +el.dataset.d), c = S.log[k] || { c: false, n: '' };
      c.c = !c.c; S.log[k] = c; ui.day = +el.dataset.d; save(); render(); break;
    }
    case 'workdays': S.workdays = +el.dataset.n; save(); closeSheet(); render(); toast('Норма: ' + S.workdays + ' ' + plural(S.workdays, 'день', 'дня', 'дней') + ' в неделю'); break;
    case 'toggle': { const t = S.tactics.find(x => x.id === el.dataset.id); if (t) { t.done = !t.done; if (t.camp) { const m = (goalById(t.goal) || { milestones: [] }).milestones.find(x => x.id === t.camp); if (m) m.done = t.done; } save(); render(); } break; }
    case 'deltactic': S.tactics = S.tactics.filter(x => x.id !== el.dataset.id); save(); render(); toast('Тактика удалена'); break;
    case 'repeat': { const t = S.tactics.find(x => x.id === el.dataset.id); if (t) { S.tactics.push({ id: uid(), goal: t.goal, week: t.week + 1, t: t.t, done: false }); save(); toast('Добавлено в неделю ' + (t.week + 1) + '. Здесь она остаётся невыполненной'); } break; }
    case 'addtactic': tacticSheet(el.dataset.goal, ui.week || 1); break;
    case 'sheetgoal': sheetGoal = el.dataset.id; document.querySelectorAll('#tt-goals .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.id === sheetGoal)); break;
    case 'sheetweek': sheetWeek = +el.dataset.w; document.querySelectorAll('#tt-weeks .chip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.w === sheetWeek)); break;
    case 'savetactic': {
      const txt = document.getElementById('tt-text').value.trim();
      if (!txt) { document.getElementById('tt-text').focus(); return; }
      S.tactics.push({ id: uid(), goal: sheetGoal, week: sheetWeek, t: txt, done: false });
      save(); closeSheet(); ui.week = sheetWeek; render(); break;
    }
    case 'togglems': { const g = goalById(el.dataset.g), m = g && g.milestones.find(x => x.id === el.dataset.id); if (m) { m.done = !m.done; S.tactics.forEach(t => { if (t.camp === m.id) t.done = m.done; }); save(); render(); if (m.done) toast('Лагерь взят: ' + m.t); } break; }
    case 'delhabit': { const g = goalById(el.dataset.g); if (g) { g.habits = g.habits.filter(x => x.id !== el.dataset.id); save(); render(); } break; }
    case 'delms': { const g = goalById(el.dataset.g); if (g) { g.milestones = g.milestones.filter(x => x.id !== el.dataset.id); save(); render(); } break; }
    case 'ritual': { const w = +el.dataset.w; S.ritual[w] = S.ritual[w] || {}; S.ritual[w][el.dataset.k] = !S.ritual[w][el.dataset.k]; save(); render(); break; }
    case 'settings': settingsSheet(); break;
    case 'mainedit': mainSheet(); break;
    case 'savemain': {
      const v = id => document.getElementById(id).value.trim();
      Object.assign(S.main, { vision: v('mn-vision') || S.main.vision, goal: v('mn-goal') || S.main.goal, incomeTarget: v('mn-it'), income: v('mn-i'), monthTarget: v('mn-mt'), month: v('mn-m'), audTarget: v('mn-at'), aud: v('mn-a') });
      save(); closeSheet(); render(); toast('Главная цель обновлена'); break;
    }
    case 'reset':
      if (!resetArmed) { resetArmed = true; el.textContent = 'Нажми ещё раз: все отметки и разборы удалятся'; el.style.color = 'var(--low)'; return; }
      S = defaults(); S.updatedAt = Date.now(); S.draft = false; cacheLocal(); flush(); closeSheet(); ui.goal = null; ui.week = null; go('path'); toast('План сброшен к примеру'); break;
    case 'ai': runAI(+el.dataset.w); break;
    case 'closesheet': closeSheet(); break;
  }
});
function autosize(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') autosize(t);
  if (t.dataset.diary) {
    S.diary[t.dataset.diary] = t.value; save();
    const st = document.getElementById('ds-' + t.dataset.diary); if (st) st.textContent = t.value ? 'сохранено' : '';
  }
  else if (t.dataset.note) {
    const k = t.dataset.note, c = S.log[k] || { c: false, n: '' }; c.n = t.value; S.log[k] = c; save();
    const [w, g, d] = k.split(':'), cb = document.querySelector('.cb[data-g="' + g + '"][data-d="' + d + '"]');
    if (cb) { const dot = cb.querySelector('.has-note'); if (c.n && !dot) cb.insertAdjacentHTML('beforeend', '<i class="has-note"></i>'); if (!c.n && dot) dot.remove(); }
  }
  else if (t.dataset.prio) { planOf(ui.week).top[+t.dataset.prio] = t.value; save(); }
  else if (t.dataset.thanks) { planOf(ui.week).thanks = t.value; save(); }
  else if (t.dataset.review) {
    const w = t.dataset.rw !== undefined ? +t.dataset.rw : ui.week;
    S.reviews[w] = S.reviews[w] || {}; S.reviews[w][t.dataset.review] = t.value; save();
    const mk = document.querySelector('.qw[data-w="' + w + '"] .qmk'); if (mk) mk.classList.toggle('on', hasAnswers(w));
  }
  else if (t.dataset.gfield) { const g = goalById(t.dataset.id); if (g) { g[t.dataset.gfield] = t.value; save(); } }
});
document.addEventListener('change', e => {
  if (e.target.id === 'st-start' && e.target.value) { S.start = e.target.value; save(); render(); }
  if (e.target.id === 'im-file' && e.target.files[0]) { e.target.files[0].text().then(t => { const box = document.getElementById('im-json'); if (box) box.value = t; toast(parseBackup(t) ? 'Файл прочитан. Нажми «Загрузить»' : 'Это не похоже на копию данных'); }); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form === 'ptask') {
    e.preventDefault();
    const txt = f.querySelector('input').value.trim(); if (!txt) return;
    const p = planOf(ui.week); (p.days[ui.pday] = p.days[ui.pday] || []).push({ id: uid(), t: txt, done: false }); save(); render();
    const again = document.getElementById('pt-new'); if (again) again.focus({ preventScroll: true });
    return;
  }
  if (f.dataset.form === 'habit') {
    e.preventDefault();
    const txt = f.querySelector('#hb-new-' + f.dataset.g).value.trim(), norm = f.querySelector('#hb-norm-' + f.dataset.g).value.trim();
    if (!txt) return;
    const g = goalById(f.dataset.g); g.habits.push({ id: uid(), t: txt, norm }); save(); render();
    const again = document.getElementById('hb-new-' + g.id); if (again) again.focus();
    return;
  }
  if (f.dataset.form !== 'ms') return;
  e.preventDefault();
  const inp = f.querySelector('input'), txt = inp.value.trim(); if (!txt) return;
  const g = goalById(f.dataset.g); g.milestones.push({ id: uid(), t: txt, done: false }); save(); render();
  const again = document.getElementById('ms-new-' + g.id); if (again) again.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (TABS.some(t => t[0] === r) && r !== ui.route) { ui.goal = null; go(r); } });

const h0 = location.hash.slice(1);
if (TABS.some(t => t[0] === h0)) ui.route = h0;
render();
connect();
(async () => {
  try { const s = window.claude && await claude.use('sample'); ui.sampleFn = s; ui.sample = s ? true : null; }
  catch(e) { ui.sample = null; }
  if (ui.route === 'week') refreshAI(ui.week);
})();
})();
</script>
